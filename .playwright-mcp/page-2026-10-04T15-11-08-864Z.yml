            - generic [ref=e210]: Digital heritage,
            - generic [ref=e212]: reimagined.
          - paragraph [ref=e214]: Heritage Discovery combines visual recognition, similarity search, open-set verification and grounded heritage information into one surface. A photograph goes in; a place, a record and the sources behind that record come out.
          - paragraph [ref=e215]: The part that matters most is the part that refuses. When the collection cannot name what it is looking at, the system says so rather than offering the nearest plausible answer — because an uncertain identification and a certain one look identical on screen, and only one of them is worth anything.
