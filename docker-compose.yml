version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: heritage
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./docker/backend
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/heritage
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./docker/frontend
    volumes:
      - ../frontend:/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  postgres_data:
